name: Manual RSS fallback

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run RSS fallback
        env:
          DASHBOARD_OUTPUT: data/dashboard.draft.json
        run: npm run update:news

      - name: Validate and finalize snapshot
        run: npm run prepare:data

      - name: Commit fallback snapshot
        run: |
          if git diff --quiet -- data/dashboard.json; then
            echo "No data changes"
          else
            git config user.name "ai-market-pulse-fallback"
            git config user.email "actions@users.noreply.github.com"
            git add data/dashboard.json
            git commit -m "data: refresh from RSS fallback"
            git push
          fi
